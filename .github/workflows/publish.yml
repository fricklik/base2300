name: Publish to npm
# Publishes the package when a version tag (v0.1.0, v1.2.3, ...) is pushed.
# Uses npm Trusted Publishing (OIDC): no npm token is stored in GitHub.
# Prerequisite: the package exists on npmjs.com and this repository/workflow is
# registered as a Trusted Publisher in the package settings (see docs/releasing.md).
on:
  push:
    tags: ['v*']
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      # Trusted publishing requires npm >= 11.5.1.
      - run: npm install -g npm@latest && npm --version
      - name: Check that the tag matches package.json
        run: |
          PKG="v$(node -p "require('./package.json').version")"
          if [ "$PKG" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $PKG" >&2
            exit 1
          fi
      - run: npm ci
      - run: npm run check
      - run: npm pack --dry-run
      - run: npm publish --access public
